name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행용

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 진행 중인 배포는 끝까지 두고, 대기 중인 것만 최신으로 교체
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      # 포함 목록 방식: 사이트에 필요한 파일만 _site 에 담는다.
      # HANDOFF.md, README.md, font-preview.html 등은 자동으로 제외된다.
      - name: Prepare site files
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
